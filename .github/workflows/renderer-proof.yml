name: Renderer Proof

on:
  pull_request:
    paths:
      - "video/src/doodle-explainer*.jsx"
      - "video/src/doodle-renderer-proof.jsx"
      - "video/src/root.jsx"
      - ".github/workflows/renderer-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Render representative proof frames and motion
        shell: bash
        run: |
          mkdir -p dist/renderer-proof
          frames=(45 135 225 315 405 495 585 675 765 855)
          i=1
          for frame in "${frames[@]}"; do
            printf -v name "%02d" "$i"
            npx remotion still video/src/index.jsx WhatIfDoodleRendererProof "dist/renderer-proof/${name}.png" --frame="$frame"
            i=$((i+1))
          done
          test "$(find dist/renderer-proof -name '*.png' | wc -l)" -eq 10
          npx remotion render video/src/index.jsx WhatIfDoodleRendererProof dist/renderer-proof/proof.mp4 --scale=0.5 --crf=28
          test -s dist/renderer-proof/proof.mp4
      - name: Upload renderer proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renderer-proof-frames
          path: dist/renderer-proof/*
          if-no-files-found: error
          retention-days: 7
