name: Publishing Control Plane Guard

on:
  pull_request:
    paths:
      - "config/autonomy.json"
      - "queue/daily-control.json"
      - "episodes/episode-state.schema.json"
      - "docs/EPISODE_STATE_PROTOCOL.md"
      - "tools/publishing-control-plane.mjs"
      - "tools/publishing-control-plane.test.mjs"
      - ".github/workflows/publishing-control-plane-guard.yml"
  push:
    branches: [main]
    paths:
      - "config/autonomy.json"
      - "queue/daily-control.json"
      - "episodes/episode-state.schema.json"
      - "docs/EPISODE_STATE_PROTOCOL.md"
      - "tools/publishing-control-plane.mjs"
      - "tools/publishing-control-plane.test.mjs"
      - ".github/workflows/publishing-control-plane-guard.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test publishing controls
        run: node --test tools/publishing-control-plane.test.mjs
      - name: Validate publishing controls
        run: node -e "import('./tools/publishing-control-plane.mjs').then(({validateFiles}) => validateFiles('config/autonomy.json','queue/daily-control.json'))"
