name: Publishing Control Plane Guard

on:
  pull_request:
    paths:
      - "config/autonomy.json"
      - "queue/daily-control.json"
      - "episodes/episode-state.schema.json"
      - "episodes/current/thumbnail-source.json"
      - "docs/EPISODE_STATE_PROTOCOL.md"
      - "tools/publishing-control-plane.mjs"
      - "tools/publishing-control-plane.test.mjs"
      - "youtube_uploader/**"
      - "scripts/verify_render_artifact.py"
      - "scripts/test_verify_render_artifact.py"
      - "scripts/prepare_thumbnail_override.py"
      - "scripts/test_prepare_thumbnail_override.py"
      - ".github/workflows/upload-youtube.yml"
      - ".github/workflows/publishing-control-plane-guard.yml"
  push:
    branches: [main]
    paths:
      - "config/autonomy.json"
      - "queue/daily-control.json"
      - "episodes/episode-state.schema.json"
      - "episodes/current/thumbnail-source.json"
      - "docs/EPISODE_STATE_PROTOCOL.md"
      - "tools/publishing-control-plane.mjs"
      - "tools/publishing-control-plane.test.mjs"
      - "youtube_uploader/**"
      - "scripts/verify_render_artifact.py"
      - "scripts/test_verify_render_artifact.py"
      - "scripts/prepare_thumbnail_override.py"
      - "scripts/test_prepare_thumbnail_override.py"
      - ".github/workflows/upload-youtube.yml"
      - ".github/workflows/publishing-control-plane-guard.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test publishing controls
        run: node --test tools/publishing-control-plane.test.mjs
      - name: Validate publishing controls
        run: node -e "import('./tools/publishing-control-plane.mjs').then(({validateFiles}) => validateFiles('config/autonomy.json','queue/daily-control.json'))"
      - name: Test YouTube publishing backbone
        run: |
          python -m unittest discover -s youtube_uploader -p 'test_*.py' -v
          python -m unittest scripts.test_verify_render_artifact -v
          python -m unittest scripts.test_prepare_thumbnail_override -v
      - name: Compile publisher Python
        run: python -m py_compile youtube_uploader/*.py scripts/verify_render_artifact.py scripts/prepare_thumbnail_override.py
