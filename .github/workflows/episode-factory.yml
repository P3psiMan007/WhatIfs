name: Episode Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "tools/episode-runner.mjs"
      - "tools/episode-runner.test.mjs"
      - "tools/episode-producer.mjs"
      - "tools/episode-producer.test.mjs"
      - "tools/kokoro-single-load.test.mjs"
      - "tools/edge-tts"
      - "tools/narration-provider-repair.mjs"
      - "tools/episode1-visual-rebuild.mjs"
      - "tools/episode1-visual-rebuild.test.mjs"
      - "tools/episode1-thumbnail-rebuild.mjs"
      - "tools/episode1-thumbnail-rebuild.test.mjs"
      - "tools/episode1-hook-contrast-rebuild.mjs"
      - "tools/episode1-hook-contrast-rebuild.test.mjs"
      - "tools/episode1-late-beat-rebuild.mjs"
      - "tools/episode1-late-beat-rebuild.test.mjs"
      - "tools/episode1-illustrated-v3-rebuild.mjs"
      - "tools/episode1-illustrated-v3-rebuild.test.mjs"
      - "tools/episode1-character-payoff-v4-rebuild.mjs"
      - "tools/episode1-character-payoff-v4-rebuild.test.mjs"
      - "tools/publish-grade-visual-guard.mjs"
      - "tools/publish-grade-visual-guard.test.mjs"
      - "tools/episode-state.mjs"
      - "episodes/current/episode-state.json"
      - "episodes/current/research.md"
      - "episodes/current/script.md"
      - "episodes/current/production-input.json"
      - "config/autonomy.json"
      - "queue/daily-control.json"
      - "queue/topics.json"
      - "queue/runner-status.json"
      - "package.json"
      - "video/**"
      - "public/visuals/**"
      - ".github/workflows/episode-factory.yml"
  pull_request:
    paths:
      - "tools/episode-runner.mjs"
      - "tools/episode-runner.test.mjs"
      - "tools/episode-producer.mjs"
      - "tools/episode-producer.test.mjs"
      - "tools/kokoro-single-load.test.mjs"
      - "tools/edge-tts"
      - "tools/narration-provider-repair.mjs"
      - "tools/episode1-visual-rebuild.mjs"
      - "tools/episode1-visual-rebuild.test.mjs"
      - "tools/episode1-thumbnail-rebuild.mjs"
      - "tools/episode1-thumbnail-rebuild.test.mjs"
      - "tools/episode1-hook-contrast-rebuild.mjs"
      - "tools/episode1-hook-contrast-rebuild.test.mjs"
      - "tools/episode1-late-beat-rebuild.mjs"
      - "tools/episode1-late-beat-rebuild.test.mjs"
      - "tools/episode1-illustrated-v3-rebuild.mjs"
      - "tools/episode1-illustrated-v3-rebuild.test.mjs"
      - "tools/episode1-character-payoff-v4-rebuild.mjs"
      - "tools/episode1-character-payoff-v4-rebuild.test.mjs"
      - "tools/publish-grade-visual-guard.mjs"
      - "tools/publish-grade-visual-guard.test.mjs"
      - "tools/episode-state.mjs"
      - "episodes/current/episode-state.json"
      - "episodes/current/research.md"
      - "episodes/current/script.md"
      - "episodes/current/production-input.json"
      - "config/autonomy.json"
      - "queue/daily-control.json"
      - "queue/topics.json"
      - "queue/runner-status.json"
      - "package.json"
      - "video/**"
      - "public/visuals/**"
      - ".github/workflows/episode-factory.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('episode-factory-pr-{0}', github.event.pull_request.number) || 'episode-factory-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - name: Install video dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Validate narration self-heal scripts
        run: |
          python -m py_compile tools/edge-tts
          node --check tools/narration-provider-repair.mjs
          ! grep -q "pip install.*edge-tts" .github/workflows/episode-factory.yml
          grep -q "kokoro==0.9.4" .github/workflows/episode-factory.yml
          grep -q "Apache-2.0" tools/narration-provider-repair.mjs
      - name: Run state, orchestration, producer, rebuild, packaging, beat alignment, registry, and visual guard tests
        run: node --test tools/episode-state.test.mjs tools/episode-runner.test.mjs tools/episode-producer.test.mjs tools/kokoro-single-load.test.mjs tools/episode1-visual-rebuild.test.mjs tools/episode1-thumbnail-rebuild.test.mjs tools/episode1-hook-contrast-rebuild.test.mjs tools/episode1-late-beat-rebuild.test.mjs tools/episode1-illustrated-v3-rebuild.test.mjs tools/episode1-character-payoff-v4-rebuild.test.mjs video/src/thumbnail-layout.test.mjs video/src/hook-contrast.test.mjs video/src/sleep-beat-phase.test.mjs video/src/sleep-visual-registry.test.mjs tools/publish-grade-visual-guard.test.mjs
      - name: Remotion episode smoke test
        run: npx remotion still video/src/index.jsx WhatIfEpisode /tmp/whatifs-smoke.png --frame=60
      - name: Remotion thumbnail smoke test
        run: npx remotion still video/src/index.jsx WhatIfThumbnail /tmp/whatifs-thumb.png
      - name: Verify smoke renders exist
        run: test -s /tmp/whatifs-smoke.png && test -s /tmp/whatifs-thumb.png

  factory:
    if: github.event_name != 'pull_request'
    needs: test
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      EPISODE_PRODUCER_CMD: ${{ vars.EPISODE_PRODUCER_CMD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore production caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            ~/.cache/huggingface/hub
          key: ${{ runner.os }}-node22-py311-kokoro094-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-py311-kokoro094-
            ${{ runner.os }}-node22-py311-
      - name: Install deterministic production dependencies
        shell: bash
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v espeak-ng >/dev/null 2>&1 || missing+=(espeak-ng)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          npm install --prefer-offline --no-audit --no-fund
          python -m pip install --disable-pip-version-check kokoro==0.9.4 soundfile==0.13.1
          chmod +x tools/edge-tts
          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
      - name: Verify required media tooling
        run: |
          command -v ffmpeg
          command -v ffprobe
          command -v edge-tts
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -c "from kokoro import KPipeline; print('Kokoro import OK')"
      - name: Invalidate legacy narration and select Kokoro when applicable
        run: node tools/narration-provider-repair.mjs
      - name: Activate one-shot late-beat QA repair when applicable
        run: node tools/episode1-late-beat-rebuild.mjs
      - name: Activate one-shot hook contrast QA repair when applicable
        run: node tools/episode1-hook-contrast-rebuild.mjs
      - name: Activate one-shot thumbnail QA repair when applicable
        run: node tools/episode1-thumbnail-rebuild.mjs
      - name: Activate checked-in bespoke Episode 1 visuals
        run: node tools/episode1-visual-rebuild.mjs
      - name: Activate one-shot illustrated-v3 Episode 1 repair
        run: node tools/episode1-illustrated-v3-rebuild.mjs
      - name: Activate one-shot character-payoff v4 Episode 1 repair
        run: node tools/episode1-character-payoff-v4-rebuild.mjs
      - name: Advance factory and run built-in producer
        shell: bash
        run: |
          for pass in 1 2 3; do
            set +e
            node tools/episode-runner.mjs
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then break; fi
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          done
      - name: Enforce publish-grade visual readiness
        run: node tools/publish-grade-visual-guard.mjs
      - name: Upload render, package, and QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-render
          path: |
            dist/episode.mp4
            dist/thumbnail.png
            dist/contact-sheet.jpg
            dist/first-30s-contact-sheet.jpg
            public/narration.mp3
            public/narration.srt
            episodes/current/render-manifest.json
            episodes/current/production-input.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Persist canonical state changes
        if: always()
        shell: bash
        run: |
          git config user.name "whatifs-episode-factory"
          git config user.email "whatifs-episode-factory@users.noreply.github.com"
          git add episodes/current/episode-state.json queue/topics.json queue/runner-status.json
          [ -f episodes/current/production-input.json ] && git add episodes/current/production-input.json
          [ -f episodes/current/render-manifest.json ] && git add episodes/current/render-manifest.json
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "chore: advance automatic video production"
          git pull --rebase origin main
          git push
