name: Semantic pipeline regression

on:
  pull_request:
    paths:
      - "tools/episode2-semantic-visual-rebuild.mjs"
      - "tools/episode2-semantic-visual-rebuild.test.mjs"
      - "tools/programmatic-render-proof.mjs"
      - "tools/programmatic-render-proof.test.mjs"
      - ".github/workflows/semantic-pipeline-regression.yml"
  push:
    branches: [main]
    paths:
      - "tools/episode2-semantic-visual-rebuild.mjs"
      - "tools/episode2-semantic-visual-rebuild.test.mjs"
      - "tools/programmatic-render-proof.mjs"
      - "tools/programmatic-render-proof.test.mjs"
      - ".github/workflows/semantic-pipeline-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run semantic pipeline regression tests
        run: node --test tools/episode2-semantic-visual-rebuild.test.mjs tools/programmatic-render-proof.test.mjs
