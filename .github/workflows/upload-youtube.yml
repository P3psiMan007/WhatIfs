name: Publish verified episode to YouTube

# Publication workflow: exact QA-approved artifact, private-first verification.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "episodes/current/qa-review.json"
      - "episodes/current/episode-state.json"
      - "episodes/current/render-manifest.json"
      - "episodes/current/production-input.json"
      - "episodes/current/thumbnail-source.json"
      - "episodes/current/rejected-publications/**"
      - "public/approved/**"
      - "config/autonomy.json"
      - "queue/daily-control.json"
      - "youtube_uploader/**"
      - "scripts/verify_render_artifact.py"
      - "scripts/prepare_thumbnail_override.py"
      - ".github/workflows/upload-youtube.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-current-episode
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Evaluate publication gate
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from youtube_uploader.publish_gate import evaluate_publication_gate, narrator_contract_reasons

          load = lambda p: json.loads(Path(p).read_text(encoding="utf-8"))
          decision = evaluate_publication_gate(
              load("episodes/current/qa-review.json"),
              load("episodes/current/episode-state.json"),
              load("config/autonomy.json"),
              load("queue/daily-control.json"),
          )
          narrator_reasons = narrator_contract_reasons(
              (load("episodes/current/production-input.json").get("narrator") or {})
          )
          allowed = decision.allowed and not narrator_reasons
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"eligible={'true' if allowed else 'false'}", file=out)
          if allowed:
              print("Publication gate PASS")
          else:
              print("Publication gate BLOCKED")
              for reason in decision.reasons:
                  print(f"- {reason}")
              for reason in narrator_reasons:
                  print(f"- {reason}")
          PY

      - name: Run publishing tests before side effects
        if: steps.gate.outputs.eligible == 'true'
        run: |
          python -m unittest discover -s youtube_uploader -p 'test_*.py' -v
          python -m unittest scripts.test_verify_render_artifact -v
          python -m unittest scripts.test_prepare_thumbnail_override -v
          node --test tools/publishing-control-plane.test.mjs

      - name: Resolve exact approved render source
        if: steps.gate.outputs.eligible == 'true'
        id: source
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.verify_render_artifact import parse_render_asset_uri

          qa = json.loads(Path("episodes/current/qa-review.json").read_text(encoding="utf-8"))
          ref = parse_render_asset_uri(qa["reviewedRenderAsset"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"run_id={ref.run_id}", file=out)
              print(f"artifact_name={ref.artifact_name}", file=out)
          print(f"Approved source: run={ref.run_id} artifact={ref.artifact_name}")
          PY

      - name: Download exact render artifact
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: |
          rm -rf incoming-render
          mkdir -p incoming-render
          gh run download "$RUN_ID" -n "$ARTIFACT_NAME" -D incoming-render
          test -s incoming-render/dist/episode.mp4
          test -s incoming-render/dist/thumbnail.png
          test -s incoming-render/episodes/current/render-manifest.json

      - name: Verify exact artifact identity
        if: steps.gate.outputs.eligible == 'true'
        run: |
          python scripts/verify_render_artifact.py \
            --qa-review episodes/current/qa-review.json \
            --canonical-manifest episodes/current/render-manifest.json \
            --downloaded-dir incoming-render \
            --output /tmp/render-identity.json

      - name: Prepare approved package thumbnail
        if: steps.gate.outputs.eligible == 'true'
        id: package_thumbnail
        shell: bash
        run: |
          if [ -f episodes/current/thumbnail-source.json ]; then
            python scripts/prepare_thumbnail_override.py \
              --source episodes/current/thumbnail-source.json \
              --render-manifest episodes/current/render-manifest.json \
              --output /tmp/package-thumbnail.jpg
            test -s /tmp/package-thumbnail.jpg
            echo "path=/tmp/package-thumbnail.jpg" >> "$GITHUB_OUTPUT"
          else
            test -s incoming-render/dist/thumbnail.png
            echo "path=incoming-render/dist/thumbnail.png" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload exact approved render private and verify staging state
        if: steps.gate.outputs.eligible == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m youtube_uploader.publisher \
            --video incoming-render/dist/episode.mp4 \
            --thumbnail "${{ steps.package_thumbnail.outputs.path }}" \
            --identity /tmp/render-identity.json \
            --qa-review episodes/current/qa-review.json \
            --episode-state episodes/current/episode-state.json \
            --render-manifest episodes/current/render-manifest.json \
            --autonomy config/autonomy.json \
            --daily-control queue/daily-control.json \
            --production-input episodes/current/production-input.json \
            --publication-record episodes/current/publication.json \
            --stop-after-private

      - name: Persist publication progress
        if: always() && steps.gate.outputs.eligible == 'true'
        shell: bash
        run: |
          git config user.name "whatifs-publisher"
          git config user.email "whatifs-publisher@users.noreply.github.com"
          git add queue/daily-control.json
          if [ -f episodes/current/publication.json ]; then
            git add episodes/current/publication.json
          fi
          if git diff --cached --quiet; then
            echo "No publication progress to persist."
            exit 0
          fi
          git commit -m "chore: record YouTube publication progress"
          git pull --rebase --autostash origin main
          git push

      - name: Require verified private proof
        if: steps.gate.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(Path("episodes/current/publication.json").read_text(encoding="utf-8"))
          yt = record.get("youtube") or {}
          if not yt.get("videoId"):
              raise SystemExit("publication record missing YouTube video ID")
          if not yt.get("privateVerifiedAt"):
              raise SystemExit("publication record missing verified private timestamp")
          transitions = yt.get("privacyTransitions") or []
          if "private" not in transitions:
              raise SystemExit("publication record does not prove private privacy state")
          if yt.get("publicVerifiedAt") or "public" in transitions:
              raise SystemExit("private-only staging unexpectedly became public")
          if not yt.get("processingVerified") or not yt.get("metadataVerified") or not yt.get("syntheticMediaDisclosureVerified") or not yt.get("thumbnailSetSucceeded") or not yt.get("playbackVerified"):
            raise SystemExit("private staging verification is incomplete")
          print(f"Verified private YouTube video: https://www.youtube.com/watch?v={yt['videoId']}")
          PY
