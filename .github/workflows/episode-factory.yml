name: Episode Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "tools/episode-runner.mjs"
      - "tools/episode-runner.test.mjs"
      - "tools/episode-producer.mjs"
      - "tools/episode-producer.test.mjs"
      - "tools/edge-tts"
      - "tools/narration-provider-repair.mjs"
      - "tools/render-ownership.test.mjs"
      - "tools/episode1-visual-rebuild.mjs"
      - "tools/episode1-visual-rebuild.test.mjs"
      - "tools/episode1-thumbnail-rebuild.mjs"
      - "tools/episode1-thumbnail-rebuild.test.mjs"
      - "tools/episode1-hook-contrast-rebuild.mjs"
      - "tools/episode1-hook-contrast-rebuild.test.mjs"
      - "tools/episode1-late-beat-rebuild.mjs"
      - "tools/episode1-late-beat-rebuild.test.mjs"
      - "tools/episode1-illustrated-v3-rebuild.mjs"
      - "tools/episode1-illustrated-v3-rebuild.test.mjs"
      - "tools/episode1-character-payoff-v4-rebuild.mjs"
      - "tools/episode1-character-payoff-v4-rebuild.test.mjs"
      - "tools/episode1-image-first-rebuild.mjs"
      - "tools/episode1-image-first-rebuild.test.mjs"
      - "tools/publish-grade-visual-guard.mjs"
      - "tools/publish-grade-visual-guard.test.mjs"
      - "tools/episode-state.mjs"
      - "episodes/current/episode-state.json"
      - "episodes/current/research.md"
      - "episodes/current/script.md"
      - "episodes/current/production-input.json"
      - "episodes/current/image-assets-v1.json"
      - "config/autonomy.json"
      - "queue/daily-control.json"
      - "queue/topics.json"
      - "queue/runner-status.json"
      - "package.json"
      - "package-lock.json"
      - "video/**"
      - "public/visuals/**"
      - "public/generated/**"
      - ".github/workflows/episode-factory.yml"
  pull_request:
    paths:
      - "tools/episode-runner.mjs"
      - "tools/episode-runner.test.mjs"
      - "tools/episode-producer.mjs"
      - "tools/episode-producer.test.mjs"
      - "tools/edge-tts"
      - "tools/narration-provider-repair.mjs"
      - "tools/render-ownership.test.mjs"
      - "tools/episode1-visual-rebuild.mjs"
      - "tools/episode1-visual-rebuild.test.mjs"
      - "tools/episode1-thumbnail-rebuild.mjs"
      - "tools/episode1-thumbnail-rebuild.test.mjs"
      - "tools/episode1-hook-contrast-rebuild.mjs"
      - "tools/episode1-hook-contrast-rebuild.test.mjs"
      - "tools/episode1-late-beat-rebuild.mjs"
      - "tools/episode1-late-beat-rebuild.test.mjs"
      - "tools/episode1-illustrated-v3-rebuild.mjs"
      - "tools/episode1-illustrated-v3-rebuild.test.mjs"
      - "tools/episode1-character-payoff-v4-rebuild.mjs"
      - "tools/episode1-character-payoff-v4-rebuild.test.mjs"
      - "tools/episode1-image-first-rebuild.mjs"
      - "tools/episode1-image-first-rebuild.test.mjs"
      - "tools/publish-grade-visual-guard.mjs"
      - "tools/publish-grade-visual-guard.test.mjs"
      - "tools/episode-state.mjs"
      - "episodes/current/episode-state.json"
      - "episodes/current/research.md"
      - "episodes/current/script.md"
      - "episodes/current/production-input.json"
      - "episodes/current/image-assets-v1.json"
      - "config/autonomy.json"
      - "queue/daily-control.json"
      - "queue/topics.json"
      - "queue/runner-status.json"
      - "package.json"
      - "package-lock.json"
      - "video/**"
      - "public/visuals/**"
      - "public/generated/**"
      - ".github/workflows/episode-factory.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('episode-factory-pr-{0}', github.event.pull_request.number) || 'episode-factory-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate locked af_heart narrator repair
        run: |
          node --check tools/narration-provider-repair.mjs
          python -m py_compile tools/edge-tts
          grep -q "af_heart" tools/narration-provider-repair.mjs
          grep -q "LOCKED_VOICE = \"af_heart\"" tools/edge-tts
          grep -q "LOCKED_SPEED = 0.95" tools/edge-tts
          ! grep -q "am_michael" tools/edge-tts
      - name: Restore archived Episode 1 manifest for legacy regression tests
        run: |
          git fetch --no-tags --depth=1 origin 6a7f52b7af91de1c15318fb57e7ece962aae28e6
          git show 6a7f52b7af91de1c15318fb57e7ece962aae28e6:episodes/current/image-assets-v1.json > episodes/current/image-assets-v1.json
      - name: Run state, producer, cinematic ownership, timeline, and visual guard tests
        run: node --test tools/episode-state.test.mjs tools/episode-runner.test.mjs tools/episode-producer.test.mjs tools/render-ownership.test.mjs tools/episode1-visual-rebuild.test.mjs tools/episode1-thumbnail-rebuild.test.mjs tools/episode1-hook-contrast-rebuild.test.mjs tools/episode1-late-beat-rebuild.test.mjs tools/episode1-illustrated-v3-rebuild.test.mjs tools/episode1-character-payoff-v4-rebuild.test.mjs tools/episode1-image-first-rebuild.test.mjs video/src/visual-timeline.test.mjs video/src/thumbnail-layout.test.mjs video/src/hook-contrast.test.mjs video/src/sleep-beat-phase.test.mjs video/src/sleep-visual-registry.test.mjs video/src/cinematic-full-episode.test.mjs video/src/cinematic-benchmark.test.mjs tools/publish-grade-visual-guard.test.mjs
      - name: Remotion episode smoke test
        run: npx remotion still video/src/index.jsx WhatIfEpisode /tmp/whatifs-smoke.png --frame=60
      - name: Remotion thumbnail smoke test
        run: npx remotion still video/src/index.jsx WhatIfThumbnail /tmp/whatifs-thumb.png
      - name: Verify smoke renders exist
        run: test -s /tmp/whatifs-smoke.png && test -s /tmp/whatifs-thumb.png

  factory:
    if: github.event_name != 'pull_request'
    needs: test
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      EPISODE_PRODUCER_CMD: ${{ vars.EPISODE_PRODUCER_CMD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check kokoro==0.9.4 soundfile numpy
          chmod +x tools/edge-tts
          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
      - name: Verify required media and narration tooling
        run: |
          command -v ffmpeg
          command -v ffprobe
          test "$(command -v edge-tts)" = "$GITHUB_WORKSPACE/tools/edge-tts"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python - <<'PY'
          from kokoro import KPipeline
          print('KOKORO_OK', KPipeline)
          PY
      - name: Restore locked approved narrator and invalidate rejected render
        run: node tools/narration-provider-repair.mjs
      - name: Activate the verified first-party image-first Episode 1 rebuild
        run: node tools/episode1-image-first-rebuild.mjs
      - name: Activate one-shot late-beat QA repair when applicable
        run: node tools/episode1-late-beat-rebuild.mjs
      - name: Activate one-shot hook contrast QA repair when applicable
        run: node tools/episode1-hook-contrast-rebuild.mjs
      - name: Activate one-shot thumbnail QA repair when applicable
        run: node tools/episode1-thumbnail-rebuild.mjs
      - name: Activate checked-in bespoke Episode 1 visuals
        run: node tools/episode1-visual-rebuild.mjs
      - name: Activate one-shot illustrated-v3 Episode 1 repair
        run: node tools/episode1-illustrated-v3-rebuild.mjs
      - name: Activate one-shot character-payoff v4 Episode 1 repair
        run: node tools/episode1-character-payoff-v4-rebuild.mjs
      - name: Advance factory and run built-in producer
        shell: bash
        run: |
          for pass in 1 2 3; do
            set +e
            node tools/episode-runner.mjs
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then break; fi
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          done
      - name: Enforce publish-grade visual readiness
        run: node tools/publish-grade-visual-guard.mjs
      - name: Upload render, package, and QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-render
          path: |
            dist/episode.mp4
            dist/thumbnail.png
            dist/contact-sheet.jpg
            dist/first-30s-contact-sheet.jpg
            public/narration.mp3
            public/narration.srt
            public/voice-parts/*.srt
            episodes/current/render-manifest.json
            episodes/current/production-input.json
            episodes/current/image-assets-v1.json
            public/generated/episode1/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Persist canonical state changes
        if: always()
        shell: bash
        run: |
          git config user.name "whatifs-episode-factory"
          git config user.email "whatifs-episode-factory@users.noreply.github.com"
          # Persist the complete current-episode handoff atomically. `-A` is intentional:
          # rollover deletes stale current files and creates an archive, and both must survive
          # the workflow commit or the next run can accidentally pick up the previous episode.
          git add -A episodes/current episodes/archive queue/topics.json queue/runner-status.json
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "chore: advance automatic video production"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
