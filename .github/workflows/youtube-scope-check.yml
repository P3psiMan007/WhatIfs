name: YouTube Scope Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-scope-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build temporary token file without printing secrets
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required YouTube secrets: " + ", ".join(missing))
          path = Path('/tmp/youtube_token.json')
          path.write_text(json.dumps({
              'client_id': os.environ['YOUTUBE_CLIENT_ID'],
              'client_secret': os.environ['YOUTUBE_CLIENT_SECRET'],
              'refresh_token': os.environ['YOUTUBE_REFRESH_TOKEN'],
          }), encoding='utf-8')
          path.chmod(0o600)
          PY
      - name: Check public-management scope and write non-secret result
        shell: bash
        run: |
          set +e
          python scripts/verify_token.py --token-file /tmp/youtube_token.json
          rc=$?
          set -e
          python - "$rc" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          rc = int(sys.argv[1])
          Path('queue/youtube-scope-status.json').write_text(json.dumps({
              'checkedAt': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'promotionScope': rc == 0,
              'status': 'management_scope_present' if rc == 0 else 'management_scope_absent_or_invalid',
              'secretMaterialPersisted': False,
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Persist non-secret scope result
        run: |
          git config user.name "whatifs-scope-check"
          git config user.email "whatifs-scope-check@users.noreply.github.com"
          git add queue/youtube-scope-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record YouTube scope check"
          git pull --rebase --autostash origin main
          git push
