name: Creative Quality V2

on:
  pull_request:
    paths:
      - "video/src/semantic-*.mjs"
      - "video/src/semantic-*.jsx"
      - "video/src/doodle-explainer-pro.jsx"
      - ".github/workflows/creative-quality-v2.yml"
  push:
    branches: [main, "fix/creative-quality-v2"]
    paths:
      - "video/src/semantic-*.mjs"
      - "video/src/semantic-*.jsx"
      - "video/src/doodle-explainer-pro.jsx"
      - ".github/workflows/creative-quality-v2.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test semantic shot planning
        run: node --test video/src/semantic-shot-planner.test.mjs video/src/semantic-scene-model.test.mjs
      - name: Render semantic storyboard smoke frame
        run: npx remotion still video/src/index.jsx WhatIfEpisode /tmp/semantic-v2-smoke.png --frame=60
      - name: Verify smoke frame exists
        run: test -s /tmp/semantic-v2-smoke.png
