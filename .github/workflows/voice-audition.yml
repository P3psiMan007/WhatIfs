name: Voice Audition

# Manual trigger only - generating audio and committing state changes are
# real side effects, always an explicit action.
on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Episode ID (must be SCRIPTED or VOICE_BLOCKED in episodes/current/episode-state.json)"
        required: true
      hook_path:
        description: "Optional path to a text file with the exact hook (defaults to the first ~15-30s of episodes/<id>/script.md)"
        required: false
        default: ""
      audition_voices:
        description: "Optional comma-separated Kokoro voice ids to audition (2-5, defaults to af_heart,af_bella,am_fenrir,bm_george)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate voice auditions
        env:
          EPISODE_ID: ${{ github.event.inputs.episode_id }}
          HOOK_PATH: ${{ github.event.inputs.hook_path }}
          AUDITION_VOICES: ${{ github.event.inputs.audition_voices }}
        run: npm run voice:audition

      - name: Commit updated episode state and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/current/episode-state.json "episodes/${{ github.event.inputs.episode_id }}/audio/voice-audition-manifest.json"
          git diff --cached --quiet || git commit -m "chore: voice auditions ready for ${{ github.event.inputs.episode_id }}"
          git push

      - name: Upload audition WAVs and manifest as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-auditions-${{ github.event.inputs.episode_id }}
          path: |
            episodes/${{ github.event.inputs.episode_id }}/audio/auditions/*.wav
            episodes/${{ github.event.inputs.episode_id }}/audio/voice-audition-manifest.json
          retention-days: 90
          if-no-files-found: error
