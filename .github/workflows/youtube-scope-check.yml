name: YouTube Scope Check

# Read-only credential diagnostics. This workflow never uploads or publishes media.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-scope-check.yml"
      - "scripts/verify_token.py"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build temporary token file without printing secrets
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required YouTube secrets: " + ", ".join(missing))
          path = Path('/tmp/youtube_token.json')
          path.write_text(json.dumps({
              'client_id': os.environ['YOUTUBE_CLIENT_ID'],
              'client_secret': os.environ['YOUTUBE_CLIENT_SECRET'],
              'refresh_token': os.environ['YOUTUBE_REFRESH_TOKEN'],
          }), encoding='utf-8')
          path.chmod(0o600)
          PY
      - name: Check private staging and public-promotion scopes
        shell: bash
        run: |
          set +e
          python scripts/verify_token.py --token-file /tmp/youtube_token.json --private-only
          private_rc=$?
          python scripts/verify_token.py --token-file /tmp/youtube_token.json
          promotion_rc=$?
          set -e
          python - "$private_rc" "$promotion_rc" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          private_rc = int(sys.argv[1])
          promotion_rc = int(sys.argv[2])
          private_ok = private_rc == 0
          promotion_ok = promotion_rc == 0
          if private_ok and promotion_ok:
              status = "private_and_promotion_scopes_present"
          elif private_ok:
              status = "private_scope_present_promotion_scope_missing"
          else:
              status = "private_scope_absent_or_invalid"
          Path('queue/youtube-scope-status.json').write_text(json.dumps({
              'checkedAt': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'privateUploadScope': private_ok,
              'promotionScope': promotion_ok,
              'status': status,
              'secretMaterialPersisted': False,
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Persist non-secret scope result
        run: |
          git config user.name "whatifs-scope-check"
          git config user.email "whatifs-scope-check@users.noreply.github.com"
          git add queue/youtube-scope-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record YouTube scope check"
          git pull --rebase --autostash origin main
          git push
